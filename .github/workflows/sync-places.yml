name: Sync Places from Google (weekly)

on:
  schedule:
    # Mondays, early morning in Madison
    - cron: '17 10 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync hours, ratings and business status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ] || [ -z "$DATABASE_URL" ]; then
            echo "::notice::Add DATABASE_URL and GOOGLE_PLACES_API_KEY repository secrets to enable the weekly sync."
            exit 0
          fi
          node scripts/sync-google-places.js
